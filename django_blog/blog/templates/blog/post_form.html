{% extends "blog/base.html" %}
{% block content %}

<div class="form-wrapper">

    <div class="form-card">
        <h2>
            {% if form.instance.pk %}
                Edit Post
            {% else %}
                Create New Post
            {% endif %}
        </h2>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}

                    {% if field.errors %}
                        <div class="form-error">
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    {% if form.instance.pk %}
                        Update Post
                    {% else %}
                        Publish Post
                    {% endif %}
                </button>

                <a href="{% url 'post-list' %}" class="btn-cancel">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>

{% endblock %}
