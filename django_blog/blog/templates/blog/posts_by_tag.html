{% extends "blog/base.html" %}

{% block content %}
<h2>Posts tagged "{{ tag.name }}"</h2>

{% for post in posts %}
    <div class="card mb-3 p-3">
        <h3>
            <a href="{% url 'post-detail' post.pk %}">
                {{ post.title }}
            </a>
        </h3>
        <p>{{ post.content|truncatewords:20 }}</p>
    </div>
{% empty %}
    <p>No posts with this tag.</p>
{% endfor %}

{% endblock %}
